services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasknotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasknotes}
      POSTGRES_DB: ${POSTGRES_DB:-tasknotes}
    ports:
      - "5442:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasknotes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Migration 0.3.181-01 (MDF-208) arm 1, workflow-side half. The cache
      # mount in backend/Dockerfile lives in the builder's own store, and a
      # GitHub runner starts with an empty builder, so the mount is only warm
      # if something persists it across runs. COMPOSE_BAKE=true routes the
      # build through Buildx, which is what reads this block.
      x-bake:
        cache-from:
          - type=gha,scope=backend
        cache-to:
          - type=gha,scope=backend,mode=max
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tasknotes:tasknotes@db:5432/tasknotes
    ports:
      - "8010:8010"
    volumes:
      - ./backend:/app
      - /app/.venv

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      x-bake:
        cache-from:
          - type=gha,scope=frontend
        cache-to:
          - type=gha,scope=frontend,mode=max
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010}
    ports:
      - "5183:5183"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
