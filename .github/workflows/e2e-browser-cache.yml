# E2E browser cache warmer (mayker-dev). Copied into a project by
# /sync-project (Section 6.1 rule 3) ONLY when the project's pr-tests.yml e2e job
# takes the `browsers:` row's cache fallback: a job that starts its services
# with `docker compose` on the runner's own daemon, so it cannot run in
# Playwright's container image and downloads its browsers behind actions/cache.
# A project whose e2e job runs in the container image has no browser cache and
# does not take this file.
#
# WHY A SEPARATE WORKFLOW ON THE DEFAULT BRANCH. GitHub scopes a cache to the
# ref that saved it. A pull request run saves under `refs/pull/<n>/merge`, which
# only that pull request's own later runs can read; every run can also read the
# DEFAULT BRANCH's caches. While pr-tests.yml ran on pull requests only, the
# browser cache it saved was never readable by the next pull request: measured
# on a real project, every e2e job of two measured samples printed `Cache not
# found for input keys: Linux-playwright-1.48.0, Linux-playwright-` and
# downloaded the browsers again, and the repository's cache list held a
# `Linux-playwright-1.48.0` entry per pull request and none on `main`.
# pr-tests.yml's own cache-warm run on a push to the default branch now saves
# it there too; this workflow adds a run whenever the Playwright version
# changes and a weekly one, so a repository that merges rarely keeps the key
# from eviction.
#
# KEEP THE KEY IN STEP WITH pr-tests.yml. The `Resolve E2E framework version`
# step and the `Cache E2E browsers` step's `path` and `key` below are copied
# verbatim into the e2e job's fallback form (the e2e job adds
# `restore-keys: ${{ runner.os }}-playwright-`, so a key that drifts still
# restores the nearest entry from the default branch instead of downloading).
# Install the same browsers the e2e job installs (`chromium` here).
#
# NO APT DEPENDENCIES HERE. `--with-deps` installs system packages, which this
# cache does not hold; the e2e job still installs them. Only the browser
# download is moved off the pull request's critical path.
#
# Triggers: a push to the default branch that changes the Playwright version
# (or this file, so the merge that adds it warms the cache at once); a weekly
# run, because GitHub evicts a cache no run has read for seven days; and a
# manual run.
name: E2E browser cache

on:
  push:
    branches: [main, master]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/e2e-browser-cache.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-browser-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect dependency files
        id: deps
        run: |
          set -u
          e2e=false
          if [ -f package.json ] && { [ -f playwright.config.ts ] || [ -f playwright.config.js ]; }; then e2e=true; fi
          echo "e2e=${e2e}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.deps.outputs.e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The version the lockfile installs, else the package.json spec with its
      # range characters stripped, else `unpinned`: the key names the browser
      # build the installed library expects.
      - name: Resolve E2E framework version
        if: steps.deps.outputs.e2e == 'true'
        id: e2ever
        run: |
          set -u
          ver=""
          if [ -f package-lock.json ]; then
            ver="$(node -e 'try{var l=require("./package-lock.json");var p=(l.packages||{})["node_modules/@playwright/test"];console.log((p&&p.version)||"")}catch(e){console.log("")}')"
          fi
          if [ -z "$ver" ] && [ -f package.json ]; then
            ver="$(node -e 'try{var p=require("./package.json");var d=(p.devDependencies||{})["@playwright/test"]||(p.dependencies||{})["@playwright/test"]||"";console.log(String(d).replace(/[^0-9A-Za-z.\-]/g,""))}catch(e){console.log("")}')"
          fi
          [ -n "$ver" ] || ver="unpinned"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Cache E2E browsers
        if: steps.deps.outputs.e2e == 'true'
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.e2ever.outputs.version }}

      # A hit means the default branch already holds this key: reading it is
      # what keeps it from eviction, and nothing is downloaded or saved.
      - name: Install E2E dependencies
        if: steps.deps.outputs.e2e == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: npm ci || npm install

      - name: Install E2E browsers
        if: steps.deps.outputs.e2e == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
