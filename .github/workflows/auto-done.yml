# Auto-Done pipeline (mayker-dev). Canonical template copied into a project by
# /sync-project (Section 6.2). On merge to the default branch it marks the work
# item Done. It runs in CI (no MCP).
#
# Routing is decided by `work_item_source` in .claude/project_state.json, NOT by
# which files happen to exist (MDF-040) — under `hybrid` an item can have both a
# tracker twin and a local file, and rules/work_items.md Section 3 makes the
# tracker twin authoritative, so presence-based routing would flip the shadowed
# file and strand the authoritative side:
#   - `local`: flips the frontmatter status in docs/issues/{ID}.md to done and
#     commits it back with [skip ci]. No tracker secret needed. NOTE: this pushes
#     directly to the default branch, so if that branch is protected against
#     direct pushes, set the MAYKER_FLIP_TOKEN secret (a repository admin's PAT
#     with contents: write; github-actions is NOT a selectable bypass actor).
#   - `tracker`: transitions via the tracker REST API using a repo secret.
#   - `hybrid`: for an ID in the `features` registry, transitions the tracker
#     twin AND flips docs/issues/{ID}.md when that file exists, so the two sides
#     stay visibly consistent; an ID that is not in the registry is a local-only
#     item and takes the file-flip path.
#   - no project_state.json (or a file predating this key): falls back to the
#     legacy presence-based routing.
#
# The feature ID is parsed from the `feature/{ID}-{slug}` branch name, matched
# against the known IDs in .claude/project_state.json so IDs containing hyphens
# (e.g. US-101) parse correctly. This branch contract is enforced in-session by
# the branch-guard hook.
#
# /sync-project sets the right tracker secret and curl for the configured
# provider. The default example below is ClickUp.
name: Auto-Done on merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write # for the frontmatter flip commit (local and hybrid sources)
  pull-requests: write # for the merged pull request's final phase label (MDF-281)

jobs:
  auto-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          # The work-item file flip below pushes straight to the default branch.
          # On a protected branch the default GITHUB_TOKEN cannot, and the
          # built-in github-actions bot is not selectable as a ruleset bypass
          # actor, so the flip rides a repository admin PAT when one is set.
          token: ${{ secrets.MAYKER_FLIP_TOKEN || github.token }}

      - name: Resolve feature ID from branch
        id: fid
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          id=""
          if [ -f .claude/project_state.json ]; then
            best=""
            while IFS= read -r cand; do
              [ -n "$cand" ] || continue
              case "$BRANCH" in
                "feature/$cand"|"feature/$cand-"*)
                  if [ "${#cand}" -gt "${#best}" ]; then best="$cand"; fi ;;
              esac
            done < <(jq -r '(.features // {}) | keys[]' .claude/project_state.json 2>/dev/null || true)
            id="$best"
          fi
          if [ -z "$id" ]; then
            id="$(printf '%s' "$BRANCH" | sed -nE 's#^feature/([A-Za-z]+-[0-9]+)-.*#\1#p')"
          fi
          if [ -z "$id" ]; then
            echo "::warning::could not parse a feature ID from branch '$BRANCH'; nothing to do."
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # A story that spans several repositories (MDF-226) is Done only when its
      # LAST half merges: `repos` in `.claude/feature_map.md` lists them in merge
      # order, and only the last one listed marks it. An empty cell, no row, or no
      # map at all is a single-repository story, marked here as before.
      - name: Decide whether this repository closes the story
        id: last
        if: steps.fid.outputs.id != ''
        env:
          ID: ${{ steps.fid.outputs.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          map=".claude/feature_map.md"
          repos=""
          if [ -f "$map" ]; then
            # Columns by NAME, as every other reader does; `\|` inside a cell is a
            # literal pipe, not a separator.
            repos="$(awk -v id="$ID" '
              function trim(s) { sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); return s }
              /^## Work items/ { w = 1; next }
              w && /^## / { w = 0 }
              w && /^\|/ {
                line = $0; gsub(/\\\|/, "\001", line)
                n = split(line, c, "|")
                if (!hdr) { hdr = 1; for (i = 2; i < n; i++) { h = trim(c[i]); if (h == "Feature ID") fi = i; if (h == "repos") ri = i }; next }
                if (!sep) { sep = 1; next }
                if (fi && trim(c[fi]) == id) { if (ri) print trim(c[ri]); exit }
              }' "$map")"
          fi
          if [ -z "$repos" ]; then
            echo "last=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          here="$(printf '%s' "${REPO#*/}" | tr '[:upper:]' '[:lower:]')"
          final="$(printf '%s' "$repos" | awk -F',' '{ s = $NF; sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); sub(/^.*\//, "", s); print tolower(s) }')"
          listed="$(printf '%s' "$repos" | awk -F',' -v h="$here" '{ for (i = 1; i <= NF; i++) { s = $i; sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); sub(/^.*\//, "", s); if (tolower(s) == h) { print "yes"; exit } } }')"
          if [ "$here" = "$final" ]; then
            echo "$ID spans: $repos. This repository is the last, so it marks the story Done."
            echo "last=yes" >> "$GITHUB_OUTPUT"
          elif [ "$listed" = "yes" ]; then
            echo "::notice::$ID spans: $repos. '$here' is not the last repository, so the story stays open until '$final' merges its half."
            echo "last=no" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$ID lists repos '$repos', which does not name this repository ('$here'). Not marking Done: fix the repos cell of this row in .claude/feature_map.md."
            echo "last=no" >> "$GITHUB_OUTPUT"
          fi

      # A fix whose reproduction runs only on the deployed environment (MDF-267)
      # merges with the pull request label `mayker:to-verify`, which a human may
      # remove before the merge once verified. With the label, this step marks the
      # item awaiting verification instead of Done, and Mark Done does not run:
      # the tracker item moves to `status_mapping.to_verify`, or, where the
      # project maps none, to Done with the tracker label `mayker:to-verify`; a
      # local file gets `status: to_verify`. Without the label it only logs, and
      # Mark Done marks the item Done exactly as before.
      - name: Decide Done or To verify
        id: verify
        if: steps.fid.outputs.id != '' && steps.last.outputs.last == 'yes'
        env:
          ID: ${{ steps.fid.outputs.id }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          TRACKER_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          FLIP_TOKEN_SET: ${{ secrets.MAYKER_FLIP_TOKEN != '' }}
        run: |
          set -euo pipefail
          label="mayker:to-verify"
          if ! printf '%s' "${PR_LABELS:-[]}" | jq -e --arg l "$label" 'any(.[]; . == $l)' >/dev/null 2>&1; then
            echo "The merged pull request does not carry '${label}'; Mark Done marks ${ID} done."
            echo "arm=done" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "arm=to-verify" >> "$GITHUB_OUTPUT"
          echo "The merged pull request carries '${label}': ${ID} is merged and awaits verification on the deployed environment."
          state=".claude/project_state.json"
          issue_file="docs/issues/${ID}.md"

          # ---- routing: Work Item Source, not file presence (MDF-040) ----
          wi_source=""
          in_registry="no"
          if [ -f "$state" ]; then
            wi_source="$(jq -r '(.work_item_source) // ""' "$state")"
            in_registry="$(jq -r --arg id "$ID" 'if ((.features // {}) | has($id)) then "yes" else "no" end' "$state")"
          fi
          case "$wi_source" in
            local)
              do_tracker="no"; do_file="yes" ;;
            tracker)
              do_tracker="yes"; do_file="no" ;;
            hybrid)
              # The tracker twin is authoritative (work_items.md Section 3); a
              # local file for the same ID is a shadow copy, kept consistent.
              if [ "$in_registry" = "yes" ]; then
                do_tracker="yes"
                if [ -f "$issue_file" ]; then do_file="yes"; else do_file="no"; fi
              else
                do_tracker="no"; do_file="yes"
              fi ;;
            *)
              # No project_state.json (or one predating work_item_source):
              # legacy presence-based routing.
              if [ -f "$issue_file" ]; then
                do_tracker="no"; do_file="yes"
              else
                do_tracker="yes"; do_file="no"
              fi ;;
          esac
          echo "source='${wi_source:-unknown}' in_registry=$in_registry -> tracker=$do_tracker file=$do_file"

          updated=""

          # ---- tracker side: the ci-set-status row, and ci-add-label where no status is mapped ----
          if [ "$do_tracker" = "yes" ]; then
            external_id=""
            target=""
            done_status="done"
            if [ -f "$state" ]; then
              external_id="$(jq -r --arg id "$ID" '(.features[$id].external_id) // empty' "$state")"
              target="$(jq -r '(.status_mapping.to_verify) // ""' "$state")"
              done_status="$(jq -r '(.status_mapping.done) // "done"' "$state")"
            fi
            add_label="no"
            if [ -z "$target" ]; then
              # No spare tracker status: Done, plus the label a human removes once verified.
              target="$done_status"
              add_label="yes"
            fi
            blocked=""
            if [ -z "${TRACKER_API_KEY:-}" ]; then
              blocked="TRACKER_API_KEY not set"
            elif [ -z "$external_id" ]; then
              blocked="no external_id for ${ID} in project_state.json"
            fi
            if [ -n "$blocked" ] && [ "$do_file" = "yes" ]; then
              echo "::warning::$blocked; skipping the tracker transition for ${ID} (flipping the local file only)."
              do_tracker="no"
            elif [ -n "$blocked" ]; then
              echo "::error::$blocked; cannot mark ${ID} awaiting verification."
              exit 1
            fi
          fi
          if [ "$do_tracker" = "yes" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X PUT "https://api.clickup.com/api/v2/task/${external_id}" \
              -H "Authorization: ${TRACKER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg s "$target" '{status:$s}')")"
            if [ "$code" != "200" ]; then
              echo "::error::tracker transition failed (HTTP $code) for ${ID}"; exit 1
            fi
            echo "Tracker transition for ${ID}: HTTP ${code} (${external_id} -> '${target}')."
            updated="tracker (${external_id} -> '${target}')"
            if [ "$add_label" = "yes" ]; then
              code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST "https://api.clickup.com/api/v2/task/${external_id}/tag/$(jq -rn --arg t "$label" '$t|@uri')" \
                -H "Authorization: ${TRACKER_API_KEY}")"
              if [ "$code" != "200" ]; then
                echo "::error::${ID} is '${target}' but the '${label}' label could not be added (HTTP $code). Add it on the item by hand, or it reads as verified."; exit 1
              fi
              echo "Tracker label for ${ID}: HTTP ${code} ('${label}' on ${external_id})."
              updated="${updated} + label '${label}'"
              echo "::notice::Done with the tracker label '${label}' is not verified: ${ID} is not verified until a human removes the label."
            fi
          fi

          # ---- local side: status: to_verify, committed back (no tracker API) ----
          if [ "$do_file" = "yes" ]; then
            if [ ! -f "$issue_file" ] && [ -n "$updated" ]; then
              echo "::warning::$issue_file not found; the tracker side was updated, no shadow file to flip."
            elif [ ! -f "$issue_file" ]; then
              echo "::error::$issue_file not found and no tracker side to update; cannot mark ${ID} awaiting verification."
              exit 1
            elif ! grep -qiE '^status:' "$issue_file"; then
              echo "::warning::$issue_file has no status: field; leaving as-is."
            else
              sed -i -E 's/^[Ss]tatus:.*/status: to_verify/' "$issue_file"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$issue_file"
              if git commit -m "chore(${ID}): mark to verify on merge [skip ci]"; then
                if [ "${FLIP_TOKEN_SET:-false}" != "true" ]; then
                  echo "::warning::MAYKER_FLIP_TOKEN is not set; pushing the flip with the default GITHUB_TOKEN. If the default branch is protected this push is rejected — add a repository admin's fine-grained PAT (contents: write) as that secret. See docs/DEVELOPMENT.md -> When auto-Done fails after a merge."
                fi
                git push
                updated="${updated:+$updated + }local file ($issue_file)"
              else
                echo "$issue_file is already at status: to_verify; nothing to commit."
              fi
            fi
          fi

          if [ -n "$updated" ]; then
            echo "Marked ${ID} awaiting verification on: ${updated}."
          else
            echo "::warning::nothing was updated for ${ID} (source='${wi_source:-unknown}')."
          fi

      - name: Mark Done
        if: steps.fid.outputs.id != '' && steps.last.outputs.last == 'yes' && steps.verify.outputs.arm != 'to-verify'
        env:
          ID: ${{ steps.fid.outputs.id }}
          # tracker/hybrid sources only. /sync-project sets the secret name for your tracker
          # (CLICKUP_API_KEY / LINEAR_API_KEY / JIRA_API_TOKEN[, JIRA_EMAIL]).
          TRACKER_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          # local/hybrid sources only: whether the checkout above got the admin
          # PAT that can push to a protected default branch.
          FLIP_TOKEN_SET: ${{ secrets.MAYKER_FLIP_TOKEN != '' }}
        run: |
          set -euo pipefail
          state=".claude/project_state.json"
          issue_file="docs/issues/${ID}.md"

          # ---- routing: Work Item Source, not file presence (MDF-040) ----
          wi_source=""
          in_registry="no"
          if [ -f "$state" ]; then
            wi_source="$(jq -r '(.work_item_source) // ""' "$state")"
            in_registry="$(jq -r --arg id "$ID" 'if ((.features // {}) | has($id)) then "yes" else "no" end' "$state")"
          fi
          case "$wi_source" in
            local)
              do_tracker="no"; do_file="yes" ;;
            tracker)
              do_tracker="yes"; do_file="no" ;;
            hybrid)
              # The tracker twin is authoritative (work_items.md Section 3); a
              # local file for the same ID is a shadow copy, kept consistent.
              if [ "$in_registry" = "yes" ]; then
                do_tracker="yes"
                if [ -f "$issue_file" ]; then do_file="yes"; else do_file="no"; fi
              else
                do_tracker="no"; do_file="yes"
              fi ;;
            *)
              # No project_state.json (or one predating work_item_source):
              # legacy presence-based routing.
              if [ -f "$issue_file" ]; then
                do_tracker="no"; do_file="yes"
              else
                do_tracker="yes"; do_file="no"
              fi ;;
          esac
          echo "source='${wi_source:-unknown}' in_registry=$in_registry -> tracker=$do_tracker file=$do_file"

          updated=""

          # ---- authoritative side: transition via REST (example: ClickUp) ----
          if [ "$do_tracker" = "yes" ]; then
            external_id=""
            done_status="done"
            if [ -f "$state" ]; then
              external_id="$(jq -r --arg id "$ID" '(.features[$id].external_id) // empty' "$state")"
              done_status="$(jq -r '(.status_mapping.done) // "done"' "$state")"
            fi
            blocked=""
            if [ -z "${TRACKER_API_KEY:-}" ]; then
              blocked="TRACKER_API_KEY not set"
            elif [ -z "$external_id" ]; then
              blocked="no external_id for ${ID} in project_state.json"
            fi
            if [ -n "$blocked" ] && [ "$do_file" = "yes" ]; then
              # The local flip below still records the merge, so a missing secret
              # degrades to a warning instead of a red X on the merge commit.
              echo "::warning::$blocked; skipping the tracker transition for ${ID} (flipping the local file only)."
              do_tracker="no"
            elif [ -n "$blocked" ]; then
              echo "::error::$blocked; cannot transition ${ID}."
              exit 1
            fi
          fi
          if [ "$do_tracker" = "yes" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X PUT "https://api.clickup.com/api/v2/task/${external_id}" \
              -H "Authorization: ${TRACKER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg s "$done_status" '{status:$s}')")"
            if [ "$code" != "200" ]; then
              echo "::error::tracker transition failed (HTTP $code) for ${ID}"; exit 1
            fi
            echo "Tracker transition for ${ID}: HTTP ${code} (${external_id} -> '${done_status}')."
            updated="tracker (${external_id} -> '${done_status}')"
          fi

          # ---- local side: flip frontmatter, commit back (no tracker API) ----
          if [ "$do_file" = "yes" ]; then
            if [ ! -f "$issue_file" ] && [ -n "$updated" ]; then
              echo "::warning::$issue_file not found; the tracker side was updated, no shadow file to flip."
            elif [ ! -f "$issue_file" ]; then
              # Nothing recorded the merge on any side: fail loudly.
              echo "::error::$issue_file not found and no tracker side to update; cannot mark ${ID} done."
              exit 1
            elif ! grep -qiE '^status:' "$issue_file"; then
              echo "::warning::$issue_file has no status: field; leaving as-is."
            else
              sed -i -E 's/^[Ss]tatus:.*/status: done/' "$issue_file"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$issue_file"
              if git commit -m "chore(${ID}): mark done on merge [skip ci]"; then
                if [ "${FLIP_TOKEN_SET:-false}" != "true" ]; then
                  echo "::warning::MAYKER_FLIP_TOKEN is not set; pushing the flip with the default GITHUB_TOKEN. If the default branch is protected this push is rejected — add a repository admin's fine-grained PAT (contents: write) as that secret. See docs/DEVELOPMENT.md -> When auto-Done fails after a merge."
                fi
                git push
                updated="${updated:+$updated + }local file ($issue_file)"
              else
                echo "$issue_file is already at status: done; nothing to commit."
              fi
            fi
          fi

          if [ -n "$updated" ]; then
            echo "Marked ${ID} done on: ${updated}."
          else
            echo "::warning::nothing was updated for ${ID} (source='${wi_source:-unknown}')."
          fi

      # The pull request's phase label mirrors the item's status (MDF-281): one
      # `mayker:` label, replaced at each transition. The merge is the last one,
      # so the merged pull request gets `mayker:done`, or `mayker:to-verify`
      # alone on the to-verify arm, and loses every other phase label and the
      # retired `plan-review`. It runs only where this job marked the item. A
      # label is a notice that nothing reads, so a refused call warns and never
      # fails the merge pipeline.
      - name: Label the merged pull request with its final phase
        if: steps.fid.outputs.id != '' && steps.last.outputs.last == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ARM: ${{ steps.verify.outputs.arm }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -uo pipefail
          if [ "${ARM:-}" = "to-verify" ]; then
            final="mayker:to-verify"
            color="d93f0b"; desc="Merged, awaiting verification on the deployed environment (mayker-dev)"
          else
            final="mayker:done"
            color="0e8a16"; desc="Merged, work item done (mayker-dev)"
          fi
          args=()
          has() { printf '%s' "${PR_LABELS:-[]}" | jq -e --arg l "$1" 'any(.[]; . == $l)' >/dev/null 2>&1; }
          has "$final" || args+=(--add-label "$final")
          for old in mayker:plan-review mayker:ready-for-build mayker:in-progress mayker:in-review mayker:done mayker:to-verify plan-review; do
            [ "$old" = "$final" ] && continue
            [ "$old" = "mayker:to-verify" ] && [ "$final" = "mayker:done" ] && continue
            if has "$old"; then args+=(--remove-label "$old"); fi
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "#${PR} already carries ${final} and no other phase label."
            exit 0
          fi
          if ! gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" "${args[@]}"; then
            # The usual refusal is a label the repository does not have yet.
            gh label create "$final" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$desc" >/dev/null 2>&1 || true
            if ! gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" "${args[@]}"; then
              echo "::warning::could not set the phase label ${final} on #${PR}; the work item was marked, only its pull request label is stale."
              exit 0
            fi
          fi
          echo "#${PR} now carries ${final} (${args[*]})."

  validate-uat:
    # UAT Gherkin well-formedness check (mayker-dev), part of the merge pipeline.
    # It validates the tracked .feature files in CLAUDE.md -> Scenarios
    # directory, fails when that folder holds none while scenarios are tracked
    # elsewhere, warns and validates every tracked .feature file while the field
    # is still a placeholder, and is a no-op only when CLAUDE.md -> UAT
    # Generation is DISABLED. It validates STRUCTURE only and never runs the
    # scenarios as browser tests: the executable E2E specs (*.spec.ts) run in
    # pr-tests.yml.
    # See the plugin's DEVELOPMENT.md -> "Why UAT is validated, not executed".
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Validate UAT Gherkin is well-formed
        run: |
          set -euo pipefail
          err()  { echo "::error${1:+ file=$1}::$2"; }
          warn() { echo "::warning::$1"; }
          # The scenarios live where CLAUDE.md -> Scenarios directory says, so read it
          # there: the label anchored to the start of its list item (the file explains
          # its own fields in comments above them), bold, a code span, a trailing
          # `# comment` and a carriage return tolerated.
          field() {
            [ -f CLAUDE.md ] || return 0
            grep -m1 -E "^[[:space:]]*([-*][[:space:]]*)?[*]*$1" CLAUDE.md \
              | tr -d '\r' \
              | sed -e "s/.*$1\**[[:space:]]*//" -e 's/[[:space:]]*#.*$//' -e 's/`//g' \
                    -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' || true
          }
          case "$(field 'UAT Generation:')" in
            DISABLED|Disabled|disabled)
              echo "CLAUDE.md -> UAT Generation is DISABLED: no scenarios are generated, so UAT validation is a no-op."
              exit 0 ;;
          esac
          dir="$(field 'Scenarios directory:')"
          dir="${dir#./}"; dir="${dir%/}"
          all="$(git ls-files -- '*.feature')"
          case "$dir" in
            ''|'['*)
              # Still a placeholder (or no line at all): never a silent no-op. Validate
              # every tracked scenario, wherever a build put it, and say why.
              warn "CLAUDE.md -> Scenarios directory is not set (${dir:-no such line}); validating every tracked .feature file instead. Set it to the folder your builds write scenarios to."
              dir=""; files="$all" ;;
            *)
              files="$(git ls-files -- "$dir/*.feature")"
              if [ -z "$files" ] && [ -n "$all" ]; then
                # Scenarios exist, just not where CLAUDE.md says: the builds and this
                # check disagree about the folder, which a no-op would hide for good.
                where="$(printf '%s\n' "$all" | sed -e 's|/[^/]*$||' -e 's|^[^/]*$|.|' | sort | uniq -c \
                  | awk '{ printf "%s%s/ (%s)", (NR > 1 ? ", " : ""), $2, $1 }')"
                err "" "CLAUDE.md -> Scenarios directory is $dir/, which holds no tracked .feature file, but tracked .feature files are elsewhere: $where. Move them under $dir/, or set Scenarios directory to the folder your builds write scenarios to."
                exit 1
              fi ;;
          esac
          if [ -z "$files" ]; then
            echo "No tracked .feature file${dir:+ under $dir/ or anywhere else}: nothing to validate."
            exit 0
          fi
          fail=0
          while IFS= read -r f; do
            errs=""
            grep -qE '^[[:space:]]*Feature:' "$f" || errs="missing 'Feature:'"
            grep -qE '^[[:space:]]*(Scenario:|Scenario Outline:)' "$f" \
              || errs="${errs:+$errs; }no 'Scenario:' or 'Scenario Outline:'"
            # Scenarios must have steps: require at least one Given/When/Then.
            grep -qE '^[[:space:]]*(Given|When|Then)\b' "$f" \
              || errs="${errs:+$errs; }no Given/When/Then steps"
            # A Scenario Outline must be backed by an Examples: table.
            if grep -qE '^[[:space:]]*Scenario Outline:' "$f" \
               && ! grep -qE '^[[:space:]]*Examples:' "$f"; then
              errs="${errs:+$errs; }Scenario Outline without an Examples: table"
            fi
            if [ -n "$errs" ]; then
              err "$f" "not well-formed Gherkin: $errs"
              fail=1
            else
              echo "ok: $f"
            fi
          done <<< "$files"
          exit "$fail"
